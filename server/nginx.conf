# This listener is reachable only through the host's HTTPS reverse proxy.
limit_req_zone $binary_remote_addr zone=cms_login:10m rate=5r/m;
server {
    listen 80;
    server_name stroy-ekb.ru www.stroy-ekb.ru;
    root /data/public;
    index index.html;
    client_max_body_size 7m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /admin/login/ {
        limit_req zone=cms_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://cms:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin/ {
        proxy_pass http://cms:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /cms-preview/ {
        proxy_pass http://cms:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /admin-static/ {
        alias /data/admin-static/;
        expires 1h;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:sqlite3|py|env|md|ya?ml)$ { return 404; }
    location / {
        try_files $uri $uri/ =404;
        expires 5m;
    }
}
