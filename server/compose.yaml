services:
  cms:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    volumes:
      - cms-data:/data
    restart: unless-stopped
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - cms-data:/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cms
    restart: unless-stopped
volumes:
  cms-data:
