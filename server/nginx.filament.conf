limit_req_zone $binary_remote_addr zone=inquiries:10m rate=5r/m;
server {
    listen 80;
    server_name _;
    root /data/public;
    index index.html;
    absolute_redirect off;
    if ($host = www.xn---96-6cdfvaagt9ccbsyd1b9kh.xn--p1ai) {
        return 301 https://xn---96-6cdfvaagt9ccbsyd1b9kh.xn--p1ai$request_uri;
    }
    client_max_body_size 16m;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    if ($request_uri ~ "^/index\.html(?:\?|$)") { return 301 /$is_args$args; }
    location ~ /\. { deny all; }
    location = /api/inquiry/ {
        limit_req zone=inquiries burst=5 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/cms/public/index.php;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass cms:9000;
        fastcgi_read_timeout 40s;
    }
    location ~ ^/(admin|livewire(?:-[a-z0-9]+)?|cms-preview)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/cms/public/index.php;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass cms:9000;
        fastcgi_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/(css/filament|js/filament|fonts/filament|admin-assets)/ {
        root /app/cms/public;
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:sqlite3?|php|py|env|md|ya?ml|lock|jsonl)$ { return 404; }
    location / {
        try_files $uri $uri/ =404;
        expires 5m;
    }
}
