services:
  cms:
    image: orion-filament-cms
    build:
      context: ..
      dockerfile: server/Dockerfile.filament
      target: app
    env_file: .env.filament
    volumes:
      - filament-data:/data
    restart: unless-stopped
  web:
    image: orion-filament-web
    build:
      context: ..
      dockerfile: server/Dockerfile.filament
      target: web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - filament-data:/data:ro
    depends_on:
      - cms
    restart: unless-stopped
volumes:
  filament-data:
